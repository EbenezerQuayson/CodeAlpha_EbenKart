{% extends 'catalog/base.html' %}

{% block content %}
<div class="form-container" style="text-align: center;">
    <div style="background-color: #e8f5e9; color: var(--success); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem auto;">
        ✓
    </div>
    <h2>Password Changed Successfully</h2>
    <p style="color: var(--text-light); margin-bottom: 2rem; margin-top: 1rem;">
        Your account password has been updated. You can now use your new password to log in.
    </p>
    
    <a href="{% url 'profile_view' %}" class="btn-primary" style="display: block; width: 100%; border-radius: 4px; padding: 0.75rem;">
        Go to Your Profile
    </a>
</div>
{% endblock %}
