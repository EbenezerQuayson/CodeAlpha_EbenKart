{% extends 'catalog/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 my-5">
            <div class="card-body p-4 p-sm-5">
                <h3 class="card-title text-center mb-4">Create an Account</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Register</button>
                </form>
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    form p label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #495057;
    }
    form p input {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        margin-bottom: 1rem;
    }
    form p input:focus {
        color: #212529;
        background-color: #fff;
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
    }
    form .helptext {
        display: block;
        font-size: 0.825em;
        color: #6c757d;
        margin-top: -0.5rem;
        margin-bottom: 1rem;
    }
    form .errorlist {
        list-style: none;
        padding-left: 0;
        color: #dc3545;
        font-size: 0.875em;
        margin-top: -0.5rem;
        margin-bottom: 1rem;
    }
</style>
{% endblock %}
